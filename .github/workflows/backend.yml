name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samacode
          POSTGRES_PASSWORD: samacode
          POSTGRES_DB: samacode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U samacode"
          --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://samacode:samacode@localhost:5432/samacode_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -p 1 -count=1 ./...
